<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/styles.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Ejercicio Complementario 2 - Fetch API</title>
</head>

<body>
    <header class="p-3 text-bg-dark">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between">
                <a href="../index.html" class="d-flex align-items-center text-white text-decoration-none">
                    <img src="../img/js.png" class="bi me-2" width="48" height="48" alt="Logo JS">
                    <span class="fs-5 fw-bold">Consumo de API con DOM y Fetch</span>
                </a>
                <button type="button" id="idBtnCargar" class="btn btn-warning fw-bold">
                    Recargar Catálogo
                </button>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <h1 class="display-5 fw-bold text-center mb-4">Catálogo de Videojuegos Free-to-Play</h1>

        <!-- Contenedor para mensajes de carga o errores -->
        <div id="idEstado" class="my-3"></div>

        <!-- Contenedor dinámico para el listado (Endpoint 1) -->
        <div id="idListado" class="row row-cols-1 row-cols-md-3 g-4"></div>
    </main>

    <!-- Modal para mostrar el detalle del recurso (Endpoint 2) -->
    <div class="modal fade" id="idModalDetalle" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="idModalTitulo">Detalle del Recurso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="idModalCuerpo">
                    <!-- Contenido dinámico vía DOM -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/complementario2.js" defer></script>
</body>

</html>
