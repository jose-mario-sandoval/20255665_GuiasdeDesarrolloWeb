<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/stylesFunciones.css" rel="stylesheet" />
    <link rel="icon" href="../img/js.png" sizes="32x32" type="image/png" />
    <title>Ficha de estudiante</title>
</head>

<body>
    <header>
        <div class="px-3 py-2 text-bg-dark fixed-top">
            <div class="container">
                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                    <a href="../indexFunciones.html" aria-label="Inicio de funciones"
                        class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-white text-decoration-none">
                        <img src="../img/js.png" alt="" width="32" height="32" class="me-2" />
                    </a>
                    <ul class="nav col-12 col-lg-auto my-2 justify-content-center my-md-0 text-small nav-bar">
                        <li class="text-center">
                            <a href="recursividad.html" class="nav-link text-white">
                                <i class="bi bi-arrow-clockwise bi-2 d-block"></i> Recursividad
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="tabla.html" class="nav-link text-white">
                                <i class="bi bi-table bi-2 d-block"></i> Creando una Tabla
                            </a>
                        </li>
                        <li class="text-center">
                            <a href="formulario.html" class="nav-link text-white">
                                <i class="bi bi-ui-checks bi-2 d-block"></i> Formulario
                            </a>
                        </li>
                        <li class="text-center nav-bar-li-active">
                            <a href="fichaEstudiante.html" class="nav-link text-white" aria-current="page">
                                <i class="bi bi-person-badge bi-2 d-block"></i> Ficha de estudiante
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <main class="container-lg">
        <div class="shadow-lg p-3 mt-5 bg-body rounded">
            <h3>Ficha de estudiante</h3>
            <form id="idFormEstudiante" class="row g-3" novalidate>
                <div class="col-md-6">
                    <label for="idCarnet" class="form-label">Carnet</label>
                    <input type="text" id="idCarnet" class="form-control" placeholder="AB001" aria-describedby="idCarnetError" required />
                    <div id="idCarnetError" class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                    <label for="idNombreCompleto" class="form-label">Nombre completo</label>
                    <input type="text" id="idNombreCompleto" class="form-control" autocomplete="name" aria-describedby="idNombreCompletoError" required />
                    <div id="idNombreCompletoError" class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                    <label for="idDui" class="form-label">DUI</label>
                    <input type="text" id="idDui" class="form-control" placeholder="12345678-9" aria-describedby="idDuiError" required />
                    <div id="idDuiError" class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                    <label for="idNit" class="form-label">NIT</label>
                    <input type="text" id="idNit" class="form-control" placeholder="1234-123456-123-4" aria-describedby="idNitError" required />
                    <div id="idNitError" class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                    <label for="idFechaNacimiento" class="form-label">Fecha de nacimiento</label>
                    <input type="date" id="idFechaNacimiento" class="form-control" aria-describedby="idFechaNacimientoError" required />
                    <div id="idFechaNacimientoError" class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                    <label for="idCorreo" class="form-label">Correo electrónico</label>
                    <input type="email" id="idCorreo" class="form-control" placeholder="estudiante@ejemplo.com" autocomplete="email" aria-describedby="idCorreoError" required />
                    <div id="idCorreoError" class="invalid-feedback"></div>
                </div>
                <div class="col-md-6">
                    <label for="idEdad" class="form-label">Edad</label>
                    <input type="text" id="idEdad" class="form-control" inputmode="numeric" aria-describedby="idEdadError" required />
                    <div id="idEdadError" class="invalid-feedback"></div>
                </div>
                <div class="col-12">
                    <button type="submit" id="idBtnValidar" class="btn btn-success">
                        <i class="bi bi-check-circle"></i> Validar ficha
                    </button>
                    <button type="reset" id="idBtnLimpiarFicha" class="btn btn-secondary">Limpiar formulario</button>
                </div>
            </form>
            <div id="idResultadoValidacion" class="mt-3" role="status" aria-live="polite"></div>
        </div>
    </main>
    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../js/fichaEstudiante.js" defer></script>
</body>

</html>
